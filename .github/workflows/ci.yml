name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify module
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test (all packages, race)
        run: go test -race ./...

      - name: Coverage on gated packages
        run: >
          go test -coverprofile=coverage.out -covermode=atomic
          ./internal/bootstrap
          ./internal/core/metrics
          ./internal/core/middleware
          ./internal/core/storage
          ./internal/core/handlers
          ./internal/api/open/v1
          ./internal/api/admin/handlers
          ./pkg/utils
          ./pkg/response
          ./pkg/ginext

      - name: Coverage gate (gated packages >= 55%)
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/total:/ {gsub(/%/,"",$3); print $3}')
          echo "gated package coverage: ${pct}%"
          python3 -c "import sys; p=float('${pct}'); sys.exit(0 if p>=55 else 1)"

      - name: Docs link sanity (required pages exist)
        run: |
          test -f docs/README.md
          test -f docs/advanced/architecture.md
          test -f docs/advanced/testing.md
          test -f docs/features/realtime.md
          test -f docs/tracing.md
          ! grep -R --include='*.md' -n '"app/' docs || (echo 'docs still contain old module import \"app/\"' && exit 1)
          ! grep -R --include='*.md' -n '/api/v1/auth' docs || (echo 'docs still contain stale /api/v1/auth paths' && exit 1)

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Regenerate Swagger
        run: swag init -g ./cmd/server/main.go -o ./docs

      - name: Check Swagger artifact drift
        run: git diff --exit-code docs/docs.go docs/swagger.json docs/swagger.yaml

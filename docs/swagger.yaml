basePath: /api
definitions:
  handlers.UpdateUserRolesRequest:
    properties:
      role_ids:
        items:
          type: integer
        type: array
    required:
    - role_ids
    type: object
  models.Menu:
    properties:
      children:
        items:
          $ref: '#/definitions/models.Menu'
        type: array
      component:
        type: string
      created_at:
        description: 时间戳
        type: string
      external:
        type: boolean
      icon:
        type: string
      id:
        type: integer
      keep_alive:
        type: boolean
      meta:
        description: Meta 信息 (JSON)
        type: string
      name:
        type: string
      parent:
        allOf:
        - $ref: '#/definitions/models.Menu'
        description: 关联
      parent_id:
        type: integer
      path:
        type: string
      permission:
        description: 权限相关
        type: string
      roles:
        items:
          $ref: '#/definitions/models.Role'
        type: array
      sort:
        type: integer
      status:
        type: integer
      title:
        type: string
      type:
        type: integer
      updated_at:
        type: string
      visible:
        type: integer
    type: object
  models.MenuMeta:
    properties:
      activeMenu:
        type: string
      affix:
        type: boolean
      alwaysShow:
        type: boolean
      breadcrumb:
        type: boolean
      hidden:
        type: boolean
      icon:
        type: string
      keepAlive:
        type: boolean
      noCache:
        type: boolean
      title:
        type: string
    type: object
  models.Role:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      menus:
        items:
          $ref: '#/definitions/models.Menu'
        type: array
      name:
        type: string
      perm_list:
        items:
          type: string
        type: array
      status:
        type: integer
      updated_at:
        type: string
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
  models.Todo:
    properties:
      completed:
        type: boolean
      created_at:
        description: CreatedAt CustomTime `json:"created_at"`
        type: string
      description:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        description: UpdatedAt CustomTime `json:"updated_at"`
        type: string
    required:
    - title
    type: object
  models.User:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_super_admin:
        description: Virtual field, not stored in database
        type: boolean
      nickname:
        type: string
      roles:
        items:
          $ref: '#/definitions/models.Role'
        type: array
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  response.PagedList:
    properties:
      items: {}
      pagination:
        $ref: '#/definitions/response.PaginationMeta'
    type: object
  response.PaginationMeta:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  response.Response:
    properties:
      code:
        description: Business status code
        type: integer
      data:
        description: Response data
      message:
        description: Response message
        type: string
      trace_id:
        description: Trace ID for request tracking
        type: string
    type: object
  services.CreateMenuRequest:
    properties:
      component:
        type: string
      external:
        type: boolean
      icon:
        type: string
      keep_alive:
        type: boolean
      meta:
        $ref: '#/definitions/models.MenuMeta'
      name:
        type: string
      parent_id:
        type: integer
      path:
        type: string
      permission:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      sort:
        type: integer
      status:
        type: integer
      title:
        type: string
      type:
        type: integer
      visible:
        type: integer
    required:
    - name
    - title
    type: object
  services.CreateTodoRequest:
    properties:
      description:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  services.CreateUserRequest:
    properties:
      avatar:
        type: string
      email:
        type: string
      nickname:
        type: string
      password:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      status:
        type: integer
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  services.MenuMeta:
    properties:
      hidden:
        type: boolean
      icon:
        type: string
      keepAlive:
        type: boolean
      title:
        type: string
    type: object
  services.MenuRouteItem:
    properties:
      children:
        items:
          $ref: '#/definitions/services.MenuRouteItem'
        type: array
      component:
        type: string
      id:
        type: integer
      meta:
        $ref: '#/definitions/services.MenuMeta'
      name:
        type: string
      path:
        type: string
      sort:
        type: integer
    type: object
  services.UpdateMenuRequest:
    properties:
      component:
        type: string
      external:
        type: boolean
      icon:
        type: string
      keep_alive:
        type: boolean
      meta:
        $ref: '#/definitions/models.MenuMeta'
      name:
        type: string
      parent_id:
        type: integer
      path:
        type: string
      permission:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      sort:
        type: integer
      status:
        type: integer
      title:
        type: string
      type:
        type: integer
      visible:
        type: integer
    type: object
  services.UpdateTodoRequest:
    properties:
      completed:
        type: boolean
      description:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  v1.UpdateMenuRolesRequest:
    properties:
      role_ids:
        items:
          type: integer
        type: array
    required:
    - role_ids
    type: object
  ws.Message:
    properties:
      content:
        type: string
      from:
        type: string
      timestamp:
        type: integer
      to:
        description: User ID or Group ID
        type: string
      type:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: A modern Go admin scaffold API server.
  title: Go Admin Scaffold API
  version: "1.0"
paths:
  /admin/v1/i18n/locales:
    get:
      consumes:
      - application/json
      description: Get list of supported locales
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
      summary: Get supported locales
      tags:
      - i18n
  /admin/v1/i18n/translations:
    get:
      consumes:
      - application/json
      description: Get translation data for specified locale
      parameters:
      - description: Locale (e.g., zh, en)
        in: query
        name: locale
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get translations
      tags:
      - i18n
  /admin/v1/menus:
    get:
      consumes:
      - application/json
      description: Get list of all menus
      produces:
      - application/json
      responses:
        "200":

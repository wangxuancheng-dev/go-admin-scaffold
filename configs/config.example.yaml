app:
  name: "Go Admin"
  env: "development"  # production: disables /swagger/* and /api/test/* (dev-only routes)
  mode: "development"
  debug: true
  baseUrl: "http://localhost:8080"
  api_prefix: "/api/v1"
  port: 8080

server:
  address: "0.0.0.0:8080"
  mode: "debug"  # debug, release, test

database:
  # driver: mysql | postgres | postgresql | pg
  driver: "mysql"
  host: "localhost"
  port: "3306"
  username: "root"
  password: ""
  database: "go_admin"
  charset: "utf8mb4"
  # PostgreSQL only (DSN sslmode / TimeZone); ignored by MySQL
  sslmode: "disable"   # e.g. require, verify-full
  timezone: "UTC"      # e.g. Asia/Shanghai
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600  # seconds

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

jwt:
  # When app.env is production, secret must be at least 32 characters (enforced at startup).
  secret: "change-me-use-at-least-32-chars-in-production"
  expire_time: 86400  # 24 hours
  issuer: "go-admin"

super_admin:
  # Numeric user IDs from your users table; loaded once at startup.
  user_ids: ["1"]

cache:
  driver: "redis"  # file, redis
  prefix: "goadmin:"
  options:
    ttl: 3600  # seconds
    # File cache options (when driver is "file")
    file_path: "storage/cache"  # Cache file directory
    # Redis cache options (when driver is "redis")
    host: "localhost"
    port: 6379
    password: ""
    db: 0

queue:
  # Asynq（Redis）；driver 可为 redis 或 asynq
  driver: "redis"
  queue: "default"
  # 秒；Unique 入队去重窗口。省略则驱动默认约 24h
  # unique_ttl: 86400
  # 省略 redis 时：host/port/password 用顶层 redis，仅 db 可单独指定（推荐与缓存等业务分库）
  connection:
    db: 1
  # 若需完整自定义 URL，可写： redis: "redis://:pass@host:6379/2"
  # 仅 timeout（秒）：Asynq Server 优雅关闭等待时间
  worker:
    timeout: 60
  # priority：队列权重（须 >0）；processes：并发份额，各队列相加 = Server 总并发
  queues:
    default:
      priority: 3
      processes: 1
    high:
      priority: 6
      processes: 2
    low:
      priority: 1
      processes: 1

log:
  level: "debug"  # debug, info, warn, error
  filename: "storage/logs/app.log"  # daily: true -> app-YYYY-MM-DD.log, auto switch at local midnight
  daily: true       # cross-day rotation without restart; same-day size limit still uses max_size
  # IANA zone for calendar day boundary & max_age cleanup (e.g. Asia/Shanghai, UTC). Empty or "Local" = process default (TZ / OS).
  timezone: "Asia/Shanghai"
  max_size: 100     # megabytes per day file before lumberjack splits
  max_backups: 3
  max_age: 28       # days; removes dated files older than this (daily mode)
  compress: true

cors:
  # Prefer explicit origins. Wildcard "*" cannot be combined with allow_credentials=true.
  allow_origins: ["http://localhost:3000", "http://localhost:5173"]
  allow_methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
  allow_headers: ["Origin", "Content-Type", "Accept", "Authorization"]
  expose_headers: ["Content-Length"]
  allow_credentials: true
  max_age: 24h  # parsed with viper.GetDuration (time.Duration)

metrics:
  enabled: true
  # Required when app.env=production. Scrape with Authorization: Bearer <token> or X-Metrics-Token.
  token: ""

# Cron: omitted run_in_server → true in non-production, false in production.
# For production split: keep false and run cmd/scheduler.
scheduler:
  run_in_server: true

# Realtime WS/SSE: omitted allow_query_token → true in non-production, false in production.
# Prefer Bearer / Sec-WebSocket-Protocol / POST /realtime/ticket then ?ticket=.
realtime:
  allow_query_token: true
  ticket_ttl_seconds: 60

i18n:
  default_locale: "en"
  load_path: "./locales"
  available_locales: ["en", "zh"]

storage:
  driver: "local"  # local, s3
  local:
    path: "storage/uploads"  # 本地存储路径
  s3:
    endpoint: "https://s3.amazonaws.com"  # S3 端点
    access_key_id: ""  # S3 访问密钥 ID
    secret_access_key: ""  # S3 访问密钥
    bucket: "your-bucket"  # S3 存储桶
    region: "us-west-2"  # S3 区域
    use_ssl: true  # 是否使用 SSL 